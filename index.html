<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendriers Amicale</title>
<meta name="theme-color" content="#c62828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendriers">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --rouge: #c62828; --fond: #f6f6f6; --carte: #fff; --texte: #1d1d1d; --gris: #6b6b6b; --bord: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --fond: #121212; --carte: #1e1e1e; --texte: #eee; --gris: #aaa; --bord: #333; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.4 system-ui, sans-serif; background: var(--fond); color: var(--texte); }
  header { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--rouge); color: #fff; }
  header button { background: none; border: 0; color: #fff; font: inherit; padding: 0; }
  #sync { font-size: 14px; } #sync.attente { font-weight: bold; }
  main { padding: 12px 16px 80px; max-width: 640px; margin: auto; }
  h2 { margin: 8px 0; } h3 { margin: 18px 0 6px; font-size: 16px; color: var(--gris); text-transform: uppercase; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn, .carte, .foyer, .grille button, .modes button, .filtres button, .plus {
    display: block; width: 100%; padding: 14px; margin: 8px 0; border: 1px solid var(--bord); border-radius: 12px; background: var(--carte); text-align: left; }
  .btn { background: var(--rouge); color: #fff; border: 0; text-align: center; font-weight: 600; }
  .btn.ok { background: #2e7d32; }
  .lien { display: block; margin: 14px auto; background: none; border: 0; color: var(--gris); text-decoration: underline; }
  .carte { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
  .carte span:not(.m), .carte progress { grid-column: 1 / -1; } .carte span { color: var(--gris); font-size: 15px; } .carte .m { color: var(--texte); font-weight: 600; }
  progress { width: 100%; accent-color: var(--rouge); }
  .filtres { display: flex; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top) + 44px); background: var(--fond); padding: 4px 0; z-index: 1; }
  .filtres button { margin: 0; padding: 8px 4px; text-align: center; font-size: 15px; }
  .sel { background: var(--rouge) !important; color: #fff !important; border-color: var(--rouge) !important; }
  .foyer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; border-left: 6px solid var(--bord); }
  .foyer small { color: var(--gris); text-align: right; }
  .s1 { border-left-color: #2e7d32; } .s2 { border-left-color: #f9a825; } .s3, .s4 { border-left-color: #9e9e9e; opacity: .7; } .s5 { border-left-color: #1565c0; }
  .plus { border-style: dashed; color: var(--gris); text-align: center; padding: 10px; }
  .vide { color: var(--gris); font-style: italic; }
  .don { padding: 12px; border-radius: 12px; background: var(--carte); border: 1px solid var(--bord); }
  .modes { display: flex; gap: 6px; } .modes button { text-align: center; padding: 12px 4px; font-size: 15px; }
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; } .grille button { margin: 0; text-align: center; }
  label { display: block; margin: 10px 0; color: var(--gris); font-size: 15px; }
  input, textarea { display: block; width: 100%; margin-top: 4px; padding: 12px; font: inherit; font-size: 18px; color: var(--texte);
    background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; }
  .cpl { margin: 0; color: var(--gris); }
  ul { padding-left: 18px; color: var(--gris); font-size: 15px; }
  table { width: 100%; border-collapse: collapse; } td { padding: 8px 0; border-bottom: 1px solid var(--bord); } td + td { text-align: right; font-weight: 600; }
  .ko { color: #c62828; } .okt { color: #2e7d32; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 18px; border-radius: 20px; }
</style>
</head>
<body>
<header><button id="retour" onclick="history.back()">‹ Retour</button><b id="titre">🚒 Calendriers</b><button id="sync" data-a="sync"></button></header>
<main id="main"></main>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
